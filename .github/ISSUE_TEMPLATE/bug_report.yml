name: Bug report
description: Code fails, a test fails, or a demo crashes.
labels: ["bug"]
body:
  - type: input
    id: day
    attributes:
      label: Day (or file)
      placeholder: "e.g. 89 or scripts/build_reflections.py"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: "e.g. Windows 11, Python 3.14.4"
    validations:
      required: true
